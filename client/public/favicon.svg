<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F1400" />
      <stop offset="100%" stop-color="#240700" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1D79F" />
      <stop offset="50%" stop-color="#C8973A" />
      <stop offset="100%" stop-color="#856426" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#grad)" />
  <!-- Inner Border Gold -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8" />
  <!-- Monogram DS -->
  <text x="32" y="42" font-family="'Playfair Display', 'Georgia', serif" font-size="28" font-weight="700" fill="#FAF7F2" text-anchor="middle" letter-spacing="1">DS</text>
</svg>